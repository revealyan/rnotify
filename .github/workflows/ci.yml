name: ci

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # MSIX собирается без подписи (дев-сертификат только локально);
      # подписанный релизный пакет — отдельная сторя S5.3.
      - run: dotnet restore rnotify.slnx

      - run: dotnet build rnotify.slnx -c Release --no-restore

      - run: dotnet format rnotify.slnx --verify-no-changes

      - run: dotnet test rnotify.slnx -c Release --no-build
